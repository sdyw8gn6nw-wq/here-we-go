<!DOCTYPE html>
<html lang="en-CA">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Here we go</title>
  <style>
    :root {
      --bg: #0b1f3a;
      --mid: #1e4d8c;
      --light: #5ba3f0;
      --pale: #d6ebff;
      --white: #f5f9ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      color: var(--white);
      background: linear-gradient(160deg, var(--bg) 0%, var(--mid) 55%, var(--light) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    main {
      max-width: 40rem;
      width: 100%;
      text-align: center;
      background: rgba(11, 31, 58, 0.45);
      border: 1px solid rgba(214, 235, 255, 0.25);
      border-radius: 1rem;
      padding: 2.5rem 2rem;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(2rem, 6vw, 2.75rem);
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--pale);
    }
    p {
      margin: 0 0 1.25rem;
      line-height: 1.5;
      color: var(--pale);
      opacity: 0.95;
    }
    .video-block {
      margin: 0 0 1.5rem;
    }
    .video-wrap {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 0.75rem;
      border: 1px solid rgba(214, 235, 255, 0.35);
      background: #000;
    }
    .video-wrap iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    .video-caption {
      margin: 0.65rem 0 0;
      font-size: 0.85rem;
      opacity: 0.85;
    }
    button.replay {
      margin-top: 0.75rem;
      cursor: pointer;
      font: inherit;
      font-weight: 600;
      color: var(--pale);
      background: transparent;
      border: 1px solid rgba(214, 235, 255, 0.45);
      border-radius: 0.6rem;
      padding: 0.55rem 1rem;
      transition: background 0.15s ease;
    }
    button.replay:hover {
      background: rgba(214, 235, 255, 0.12);
    }
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    a.button {
      display: block;
      text-decoration: none;
      color: var(--bg);
      background: var(--pale);
      border-radius: 0.6rem;
      padding: 0.85rem 1rem;
      font-weight: 600;
      border: 1px solid rgba(214, 235, 255, 0.5);
      transition: background 0.15s ease, transform 0.15s ease;
    }
    a.button:hover {
      background: #ffffff;
      transform: translateY(-1px);
    }
    a.button.secondary {
      background: transparent;
      color: var(--pale);
      border-color: rgba(214, 235, 255, 0.45);
    }
    a.button.secondary:hover {
      background: rgba(214, 235, 255, 0.12);
    }
  </style>
</head>
<body>
  <main>
    <h1>Here we go</h1>
    <div class="video-block">
      <div class="video-wrap">
        <iframe
          id="landing-video"
          title="DHC-2 Beaver water landing"
          src="https://www.youtube.com/embed/Y0CqMjMVN34?rel=0&modestbranding=1&playsinline=1"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen
          loading="lazy"
          referrerpolicy="strict-origin-when-cross-origin"
        ></iframe>
      </div>
      <p class="video-caption">DHC-2 Beaver on floats — water landing (YouTube). Use Replay anytime.</p>
      <button type="button" class="replay" id="replay-btn">Replay landing</button>
    </div>
    <p>Open a de Havilland Canada DHC-2 Beaver page:</p>
    <div class="buttons">
      <a class="button" href="https://dhc-2.com/current_cover_page.htm" target="_blank" rel="noopener noreferrer">DHC-2.com — cover page</a>
      <a class="button" href="https://en.wikipedia.org/wiki/De_Havilland_Canada_DHC-2_Beaver" target="_blank" rel="noopener noreferrer">DHC-2 Beaver — Wikipedia</a>
      <a class="button secondary" href="https://www.vikingair.com/viking-aircraft/dhc-2-beaver" target="_blank" rel="noopener noreferrer">Viking Air — DHC-2 Beaver</a>
      <a class="button secondary" href="https://www.airliners.net/search?keywords=DHC-2+Beaver" target="_blank" rel="noopener noreferrer">DHC-2 photos — Airliners.net</a>
    </div>
  </main>
  <script>
    (function () {
      var videoId = "Y0CqMjMVN34";
      var base =
        "https://www.youtube.com/embed/" +
        videoId +
        "?rel=0&modestbranding=1&playsinline=1&autoplay=1";
      var iframe = document.getElementById("landing-video");
      var btn = document.getElementById("replay-btn");
      if (!iframe || !btn) return;
      btn.addEventListener("click", function () {
        iframe.src = base + "&t=" + Date.now();
      });
    })();
  </script>
</body>
</html>
